name: aur-fetch

on:
  push:
    paths:
      - 'src/*.rs'
      - 'Cargo.*'
      - '.github/workflows/*'
  pull_request:
    paths:
      - 'src/*.rs'
      - 'Cargo.*'
      - '.github/workflows/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rust git --noconfirm --needed

      - name: Checkout
        uses: actions/checkout@v2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build
